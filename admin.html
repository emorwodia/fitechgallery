<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FITCHECK Admin</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="admin-container">

    <div class="admin-heading"><div><p class="eyebrow">STORE MANAGEMENT</p><h1>FITCHECK Admin</h1><p>Signed in as <span id="admin-email"></span></p></div><button id="logout-btn" type="button">Sign out</button></div>

    <!-- ADD PRODUCT -->

    <form id="product-form">

      <input
        type="text"
        id="product-name"
        placeholder="Product Name"
        required
      >

      <input
        type="number"
        id="product-price"
        placeholder="Price"
        required
      >

      <input
        type="text"
        id="product-category"
        placeholder="Category"
        required
      >

      <input
        type="text"
        id="product-image"
        placeholder="Image URL"
        required
      >

      <button type="submit">
        Add Product
      </button>

    </form>

    <!-- PRODUCTS -->

    <div id="admin-products">

    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
